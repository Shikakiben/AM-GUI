<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AM-GUI</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='7' fill='%233584e4'/%3E%3C/svg%3E">
  <meta name="color-scheme" content="light dark" />
  <!-- Mise à jour CSP: autoriser les requêtes (fetch) vers portable-linux-apps.github.io pour récupérer les descriptions -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' appicon: https: data:; style-src 'self' 'unsafe-inline'; script-src 'self' https://cdn.jsdelivr.net; connect-src 'self' https://portable-linux-apps.github.io https://raw.githubusercontent.com;">
</head>
<body>
  <!-- Lightbox ultra-légère pour images Markdown -->
  <div id="mdLightbox" style="display:none;position:fixed;z-index:9999;inset:0;background:rgba(0,0,0,0.88);align-items:center;justify-content:center;">
    <img id="mdLightboxImg" src="" alt="Image grand format" style="max-width:90vw;max-height:90vh;border-radius:12px;box-shadow:0 4px 30px rgba(0,0,0,.4);background:#111;" />
  </div>
  <div class="dropdown-overlay" id="categoriesDropdownOverlay" hidden></div>
  <div class="dropdown-menu-categories" id="categoriesDropdownMenu" role="menu" aria-labelledby="categoriesDropdownBtn" hidden></div>
  <header class="app-header" data-tauri-drag-region>
    <div class="brand">
  <img class="brand-icon" src="AM-GUI.png" alt="AM-GUI Icon" aria-hidden="true">
  <div class="brand-title" data-i18n="main.title"></div>
    </div>
    <div class="header-center" role="search" aria-label="Recherche">
      <div class="search">
        <span class="search-icon" aria-hidden="true">🔍</span>
        <input id="searchInput" type="search" data-i18n-placeholder="search.placeholder" autocomplete="off" />
      </div>
    </div>
    <div class="header-right">
      <div class="global-actions">
  <button id="settingsBtn" class="btn btn-outline btn-settings" title="Paramètres (Ctrl+,)" aria-haspopup="true" aria-expanded="false" aria-controls="settingsPanel"><span class="gear-icon" aria-hidden="true">⚙</span></button>
  <div id="settingsPanel" class="settings-panel settings-panel-right" role="dialog" aria-modal="false" aria-label="Paramètres" hidden tabindex="-1">
          <div class="settings-group">
            <div class="settings-title" data-i18n="settings.theme"></div>
            <label><input type="radio" name="themePref" value="system" checked> <span data-i18n="settings.auto"></span></label>
            <label><input type="radio" name="themePref" value="light"> <span data-i18n="settings.light"></span></label>
            <label><input type="radio" name="themePref" value="dark"> <span data-i18n="settings.dark"></span></label>
          </div>
          <div class="settings-group">
            <div class="settings-title" data-i18n="settings.lang"></div>
            <label><input type="radio" name="langPref" value="auto" checked> <span data-i18n="settings.auto"></span></label>
            <div id="langOptions"></div>
          </div>
          <div class="settings-group">
            <div class="settings-title" data-i18n="settings.links"></div>
            <label style="font-size:13px;"><input type="checkbox" id="openExternalLinksCheckbox"> <span data-i18n="settings.openExternal"></span></label>
          </div>
          <div class="settings-group">
            <div class="settings-title" data-i18n="settings.gpuTitle"></div>
            <label style="font-size:13px;"><input type="checkbox" id="disableGpuCheckbox"> <span data-i18n="settings.gpuLabel"></span></label>
          </div>
          <div class="settings-group" id="installScopeSettingsGroup" hidden>
            <div class="settings-title" data-i18n="settings.installScope"></div>
            <label><input type="radio" name="installScopePref" value="user" checked> <span data-i18n="install.scope.user"></span></label>
            <label><input type="radio" name="installScopePref" value="system"> <span data-i18n="install.scope.system"></span></label>
            <div class="settings-hint" data-i18n="settings.installScopeHint"></div>
          </div>
          <div class="settings-separator"></div>
          <div class="settings-group">
            <div style="margin-top:10px; display:flex; flex-direction:column; gap:6px;">
              <button id="purgeIconsBtn" class="mini-btn" type="button" style="align-self:flex-start; font-size:12px; padding:6px 10px; border:1px solid var(--border); background:var(--card); border-radius:8px; cursor:pointer;" data-i18n="settings.purge"></button>
              <div id="purgeIconsResult" style="font-size:11px; opacity:.65;"></div>
            </div>
          </div>
        </div>
      </div>
      <div class="window-buttons" aria-label="Fenêtre">
        <button class="win-btn" data-action="min" data-i18n-title="window.min">–</button>
        <button class="win-btn" data-action="max" data-i18n-title="window.max"><svg width="11" height="11" viewBox="0 0 11 11" fill="none" stroke="currentColor" stroke-width="1"><rect x="1" y="1" width="9" height="9" rx="1"/></svg></button>
        <button class="win-btn win-close" data-action="close" data-i18n-title="window.close">×</button>
      </div>
    </div>
  </header>
  <div class="sub-bar" role="toolbar" aria-label="Navigation des onglets">
    <div class="tabs-row">
      <nav class="tabs" role="tablist" aria-label="Catégories">
        <button class="tab active" role="tab" aria-selected="true" data-category="all" data-i18n="tabs.all"></button>
        <button class="tab" role="tab" aria-selected="false" data-category="installed"><span data-i18n="tabs.installed"></span> <span id="installedCount" class="badge">0</span></button>
        <button class="tab" role="tab" aria-selected="false" data-category="updates" data-i18n="tabs.updates"></button>
        <button class="tab" role="tab" aria-selected="false" data-category="advanced" data-i18n="tabs.advanced"></button>
      </nav>
      <div class="view-mode-switch" role="group" aria-label="Mode d'affichage">
        <button id="refreshBtn" class="btn btn-outline btn-refresh" data-i18n-title="refresh.title" data-i18n-aria-label="refresh.aria"><span class="icon" aria-hidden="true">↻</span></button>
        <button id="modeMenuBtn" class="btn btn-outline" aria-haspopup="true" aria-expanded="false" aria-controls="modeMenu" data-i18n-title="modeMenu.title">▦</button>
        <div id="modeMenu" class="mode-menu" role="menu" hidden>
          <button class="mode-option" data-mode="grid" role="menuitem" aria-pressed="true" data-i18n="modeMenu.grid"><span class="mode-icon" aria-hidden="true">▦</span> Grille</button>
          <button class="mode-option" data-mode="list" role="menuitem" aria-pressed="false" data-i18n="modeMenu.list"><span class="mode-icon" aria-hidden="true">≣</span> Liste</button>
          <button class="mode-option" data-mode="icons" role="menuitem" aria-pressed="false" data-i18n="modeMenu.icons"><span class="mode-icon" aria-hidden="true">◻︎</span> Icônes</button>
          <button class="mode-option" data-mode="cards" role="menuitem" aria-pressed="false" data-i18n="modeMenu.cards"><span class="mode-icon" aria-hidden="true">🂠</span> Cartes</button>
        </div>
      </div>
    </div>
    <div class="tabs-row-secondary">
      <div class="dropdown-categories">
  <button class="tab-secondary dropdown-toggle" id="categoriesDropdownBtn" aria-haspopup="true" aria-expanded="false"><span data-i18n="tabs.categories"></span> <span class="cat-arrow">▼</span></button>
      </div>
    </div>
  </div>
  <div class="scroll-shell">
    <main class="content" id="mainContent">
      <!-- Updates panel moved to top to avoid big blank space when apps list hidden -->
      <section id="updatesPanel" class="panel-lite updates-panel" hidden>
    <h2 class="panel-heading-xl" data-i18n="updates.title"></h2>
        <div class="updates-actions-row">
          <button id="runUpdatesBtn" class="btn btn-primary updates-run" data-i18n="updates.run"></button>
          <button id="updatesToggleBtn" class="btn btn-outline updates-toggle-icon" type="button" aria-expanded="false" aria-controls="updatesTerminalWrap" data-i18n-title="updates.toggleTerminal">
            <span class="updates-log-caret" aria-hidden="true">▸</span>
          </button>
        </div>
        <div id="updateSpinner" class="update-spinner" role="status" aria-live="polite" data-busy="false">
          <div class="spinner-status-row">
            
            <div class="update-timer" style="display:none;"></div>
            <div class="spinner-label" data-i18n="updates.ready"></div>
          </div>
        </div>
        <div id="updateResult" class="update-result" style="display:none;">
          <div id="updateFinalMessage" class="update-final-message"></div>
          <div id="updatedAppsIcons" class="icons-row updated-icons"></div>
        </div>
        <div id="changedScriptsResult" class="update-result" style="display:none;">
          <div id="changedScriptsFinalMessage" class="update-final-message"></div>
          <div id="changedScriptsIcons" class="icons-row updated-icons"></div>
          <div class="updates-actions-row" style="margin-top:10px;">
            <button id="reinstallChangedBtn" class="btn btn-primary updates-run" data-i18n="updates.reinstallChanged"></button>
          </div>
        </div>
        <div id="updatesLogSection" class="updates-log-section" data-open="false">
          <div id="updatesTerminalWrap" class="updates-terminal" hidden>
            <div id="updatesTerminal" class="updates-terminal-body" role="log" aria-live="polite"></div>
          </div>
        </div>
      </section>
      <section id="advancedPanel" class="panel-lite advanced-panel" hidden>
  <h2 class="panel-heading-sm centered" data-i18n="advanced.title"></h2>
    <p class="placeholder-strong"><span data-i18n="advanced.waiting"></span></p>
    <p class="note"><em><span data-i18n-html="advanced.note.appman"></span></em></p>
    <p class="placeholder-sub" data-i18n="advanced.basicIntro"></p>

    <ul class="commands condensed advanced-commands" aria-label="Commandes AM/AppMan">
      <li class="cmd-row">
        <button type="button" class="copy-cmd" data-copy="am -h">am -h</button>
        <button type="button" class="copy-cmd" data-copy="appman -h">appman -h</button>
        <span class="cmd-desc" data-i18n="advanced.cmd.help"></span>
      </li>
      <li class="cmd-row">
        <button type="button" class="copy-cmd" data-copy="am -l">am -l</button>
        <button type="button" class="copy-cmd" data-copy="appman -l">appman -l</button>
        <span class="cmd-desc" data-i18n="advanced.cmd.list"></span>
      </li>
      <li class="cmd-row">
        <button type="button" class="copy-cmd" data-copy="am -a &lt;PROGRAM&gt;">am -a &lt;PROGRAM&gt;</button>
        <button type="button" class="copy-cmd" data-copy="appman -a &lt;PROGRAM&gt;">appman -a &lt;PROGRAM&gt;</button>
        <span class="cmd-desc" data-i18n="advanced.cmd.about"></span>
      </li>
      <li class="cmd-row">
        <button type="button" class="copy-cmd" data-copy="am -i &lt;PROGRAM&gt;">am -i &lt;PROGRAM&gt;</button>
        <button type="button" class="copy-cmd" data-copy="appman -i &lt;PROGRAM&gt;">appman -i &lt;PROGRAM&gt;</button>
        <span class="cmd-desc" data-i18n="advanced.cmd.install"></span>
      </li>
      <li class="cmd-row">
        <button type="button" class="copy-cmd" data-copy="am -q &lt;mot-clé&gt;">am -q &lt;mot-clé&gt;</button>
        <button type="button" class="copy-cmd" data-copy="appman -q &lt;mot-clé&gt;">appman -q &lt;mot-clé&gt;</button>
        <span class="cmd-desc" data-i18n="advanced.cmd.query"></span>
      </li>
      <li class="cmd-row">
        <button type="button" class="copy-cmd" data-copy="am -u">am -u</button>
        <button type="button" class="copy-cmd" data-copy="appman -u">appman -u</button>
        <span class="cmd-desc" data-i18n="advanced.cmd.update"></span>
      </li>
      <li class="cmd-row">
        <button type="button" class="copy-cmd" data-copy="am -R &lt;PROGRAM&gt;">am -R &lt;PROGRAM&gt;</button>
        <button type="button" class="copy-cmd" data-copy="appman -R &lt;PROGRAM&gt;">appman -R &lt;PROGRAM&gt;</button>
        <span class="cmd-desc" data-i18n="advanced.cmd.remove"></span>
      </li>
      <li class="cmd-row">
        <button type="button" class="copy-cmd" data-copy="am -e &lt;git-url&gt; &lt;appname&gt;">am -e &lt;git-url&gt; &lt;appname&gt;</button>
        <button type="button" class="copy-cmd" data-copy="appman -e &lt;git-url&gt; &lt;appname&gt;">appman -e &lt;git-url&gt; &lt;appname&gt;</button>
        <span class="cmd-desc" data-i18n="advanced.cmd.extra"></span>
      </li>
      <li class="cmd-row">
        <button type="button" class="copy-cmd" data-copy="am translate">am translate</button>
        <span class="cmd-desc" data-i18n="advanced.cmd.translate"></span>
      </li>
    </ul>

    <p class="docs-link"><a href="https://github.com/ivan-hc/AM" target="_blank" rel="noopener"><span data-i18n="advanced.docs"></span> AM (GitHub)</a></p>
      </section>

  
  <div id="featuredBanner" class="featured-banner" aria-hidden="false"></div>
  <div id="apps" class="app-list" aria-live="polite" aria-busy="true"></div>
      <section id="appDetails" class="app-details" hidden>
    <button id="backToListBtn" class="btn btn-outline back-btn" data-i18n="details.back"></button>
        <div class="details-header">
          <div class="details-icon-wrapper" style="position:relative;display:inline-block;">
            <img id="detailsIcon" alt="Icône" />
          </div>
          <div class="details-head-text">
            <h2 id="detailsName"></h2>
          </div>
        </div>
        <div class="details-actions">
          <button id="detailsInstallBtn" class="btn btn-primary" data-i18n="details.install"></button>
          <button id="detailsForceCancelBtn" class="btn btn-outline danger" title="Forcer l'annulation" aria-label="Forcer l'annulation" hidden style="padding:6px 10px;">✕</button>
          <button id="detailsUninstallBtn" class="btn btn-outline" data-i18n="details.uninstall"></button>
          <button id="installScopeBtn" class="btn btn-outline" type="button" hidden>👤 <span data-i18n="install.scope.user"></span></button>
          <button id="sandboxOpenBtn" class="btn btn-soft-neutral sandbox-toggle-btn" type="button">
            <span data-i18n="sandbox.title"></span>
            <span id="sandboxButtonStatus" class="sandbox-pill" data-status="unknown">—</span>
          </button>
        </div>
        <div id="installStream" class="install-stream" hidden>
          <div class="install-stream-head">
            <div class="install-stream-meta">
              <span id="installStreamElapsed">0s</span>
            </div>
            <div class="install-stream-progressbar-wrapper" style="width:100%;margin-top:8px;">
              <span id="installStreamProgressPercent" style="margin-right:10px;font-weight:bold;font-size:13px;"></span>
              <progress id="installStreamProgressBar" value="0" max="100" style="vertical-align:middle;width:160px;height:14px;"></progress>
              <span id="installStreamEta" style="margin-left:12px;font-size:13px;color:var(--muted);"></span>
            </div>
          </div>
        </div>
        <div class="details-long-wrapper">
          <h3 class="details-section-title" data-i18n="details.desc"></h3>
          <p id="detailsLong" class="details-long"></p>
        </div>
        <!-- Galerie supprimée : toutes les images sont dans la description -->
      </section>
    </main>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <!-- Modale confirmation de fermeture avec installation en cours -->
  <div id="closeConfirmModal" class="modal" role="dialog" aria-modal="true" aria-label="Installation en cours" hidden>
    <div class="modal-dialog confirm-dialog" role="document">
      <div class="confirm-body">
        <p class="confirm-message" data-i18n="closeConfirm.message"></p>
        <div class="confirm-actions">
          <button id="closeConfirmStay" class="btn btn-soft-neutral" type="button" data-i18n="closeConfirm.stay"></button>
          <button id="closeConfirmQuit" class="btn btn-danger" type="button" data-i18n="closeConfirm.quit"></button>
        </div>
      </div>
    </div>
  </div>

  <!-- Lightbox supprimé : plus de galerie séparée -->
  <!-- Modale confirmation compacte (sans titre ni croix) -->
  <div id="actionConfirmModal" class="modal" role="dialog" aria-modal="true" aria-label="Confirmation" hidden>
    <div class="modal-dialog confirm-dialog" role="document">
      <div class="confirm-body">
        <p id="actionConfirmMessage" class="confirm-message"></p>
        <div class="confirm-actions">
          <button id="actionConfirmCancel" class="btn btn-soft-neutral" type="button" data-i18n="confirm.cancel"></button>
          <button id="actionConfirmOk" class="btn" type="button" data-i18n="confirm.ok"></button>
        </div>
      </div>
    </div>
  </div>

  <div id="sandboxModal" class="modal sandbox-modal" role="dialog" aria-modal="true" aria-labelledby="sandboxModalTitle" hidden>
    <div class="modal-dialog">
      <div class="modal-header">
        <h3 id="sandboxModalTitle" class="modal-title" data-i18n="sandbox.title"></h3>
        <button id="sandboxCloseBtn" class="modal-close" type="button" aria-label="Fermer">✕</button>
      </div>
      <div class="modal-body">
        <div id="sandboxCard" class="details-card sandbox-card" hidden>
          <div class="sandbox-card-head">
            <div>
              <div class="sandbox-card-title">
                <h3 data-i18n="sandbox.title"></h3>
                <span id="sandboxStatusBadge" class="sandbox-status" data-status="unknown">—</span>
              </div>
              <p class="sandbox-subtitle" data-i18n="sandbox.subtitle"></p>
            </div>
            <button id="sandboxRefreshBtn" class="btn btn-text" type="button" data-i18n="sandbox.actions.refresh"></button>
          </div>
          <div id="sandboxDepsAlert" class="sandbox-alert" role="alert" hidden>
            <div>
              <strong data-i18n="sandbox.dependencies.missing"></strong>
              <p data-i18n="sandbox.dependencies.description"></p>
            </div>
            <button id="sandboxInstallDepsBtn" class="mini-btn" type="button" data-i18n="sandbox.dependencies.install"></button>
          </div>
          <div id="sandboxUnavailable" class="sandbox-note" hidden>
            <span class="sandbox-note-strong" data-i18n="sandbox.notInstalled"></span>
            <button id="sandboxInstallAppBtn" class="btn btn-primary" type="button" data-i18n="details.install"></button>
          </div>
          <form id="sandboxForm" class="sandbox-form" autocomplete="off">
            <fieldset>
              <legend data-i18n="sandbox.shareLegend"></legend>
              <div class="sandbox-grid">
                <label><input type="checkbox" value="desktop"> <span data-i18n="sandbox.dir.desktop"></span></label>
                <label><input type="checkbox" value="documents"> <span data-i18n="sandbox.dir.documents"></span></label>
                <label><input type="checkbox" value="downloads"> <span data-i18n="sandbox.dir.downloads"></span></label>
                <label><input type="checkbox" value="games"> <span data-i18n="sandbox.dir.games"></span></label>
                <label><input type="checkbox" value="music"> <span data-i18n="sandbox.dir.music"></span></label>
                <label><input type="checkbox" value="pictures"> <span data-i18n="sandbox.dir.pictures"></span></label>
                <label><input type="checkbox" value="videos"> <span data-i18n="sandbox.dir.videos"></span></label>
              </div>
              <p class="sandbox-hint" data-i18n="sandbox.shareHint"></p>
            </fieldset>
            <label class="sandbox-custom">
              <span data-i18n="sandbox.customLabel"></span>
              <input id="sandboxCustomPath" type="text" data-i18n-placeholder="sandbox.customPlaceholder" />
              <small data-i18n="sandbox.customHint"></small>
            </label>
          </form>
          <div id="sandboxSummary" class="sandbox-summary" hidden>
            <div class="sandbox-summary-head">
              <h4 data-i18n="sandbox.summary.title"></h4>
            </div>
            <p class="sandbox-summary-hint" data-i18n="sandbox.summary.hint"></p>
            <ul id="sandboxSummaryList" class="sandbox-summary-list" hidden></ul>
            <p id="sandboxSummaryEmpty" class="sandbox-summary-empty" data-i18n="sandbox.summary.none" hidden></p>
          </div>
          <div class="sandbox-actions">
            <button id="sandboxConfigureBtn" class="btn btn-primary" type="button" data-i18n="sandbox.actions.enable"></button>
            <button id="sandboxDisableBtn" class="btn btn-outline" type="button" data-i18n="sandbox.actions.disable" disabled></button>
          </div>
          <div id="sandboxLogSection" class="sandbox-log-section" data-open="false">
            <button id="sandboxLogToggle" class="sandbox-log-toggle" type="button" aria-expanded="false" aria-controls="sandboxLog">
              <span data-i18n="sandbox.logTitle"></span>
              <span class="sandbox-log-caret" aria-hidden="true">▸</span>
            </button>
            <pre id="sandboxLog" class="sandbox-log" aria-live="polite" hidden></pre>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="nonAppimageModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="nonAppimageTitle" hidden>
    <div class="modal-dialog">
      <div class="modal-header">
        <h3 id="nonAppimageTitle" class="modal-title" data-i18n="sandbox.unsupported.title"></h3>
        <button id="nonAppimageClose" class="modal-close" type="button" aria-label="Fermer">✕</button>
      </div>
      <div class="modal-body">
        <p id="nonAppimageMessage" data-i18n="sandbox.unsupported.desc"></p>
      </div>
      <div class="modal-footer">
        <button id="nonAppimageDismiss" class="btn btn-primary" type="button" data-i18n="sandbox.unsupported.ok"></button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="src/renderer/config/constants.js"></script>
  <script src="src/renderer/utils.js"></script>
  <script src="src/renderer/services/preferences.js"></script>
  <script src="src/renderer/ui/layout.js"></script>
  <script src="src/renderer/ui/passwordPrompt.js"></script>
  <script src="src/renderer/ui/settingsPanel.js"></script>
  <script src="src/renderer/ui/toast.js"></script>
  <script src="src/renderer/ui/virtualList.js"></script>
  <script src="src/renderer/app/init.js"></script>
  <script src="src/i18n/translations.js"></script>
  <script src="src/renderer/features/categories/cache.js"></script>
  <script src="src/renderer/features/categories/dropdown.js"></script>
  <script src="src/renderer/features/categories/index.js"></script>
  <script src="src/renderer/features/search/index.js"></script>
  <script src="src/renderer/features/details/index.js"></script>  <script src="src/renderer/features/appLoader.js"></script>
  <script src="src/renderer/features/installer/index.js"></script>  <script src="src/renderer/features/sandbox/index.js"></script>  <script src="src/renderer/features/updates/index.js"></script>  <script src="src/renderer/features/featured/index.js"></script>  <script src="src/renderer/ui/syncButton.js"></script>
  <script src="src/renderer/ui/confirmModal.js"></script>
  <script src="src/renderer/ui/lightbox.js"></script>
  <script src="node_modules/@xterm/xterm/lib/xterm.js"></script>
  <script src="node_modules/@xterm/addon-fit/lib/addon-fit.js"></script>
  <script src="src/renderer/xterm-globals.js"></script>
  <script src="src/renderer/renderer.js"></script>
</body>
</html>
