name: build-AppImage (nightly)
concurrency:
  # Fixed group (not based on github.ref) so nightly runs never overlap and
  # overwrite each other's assets.
  group: nightly-build
  cancel-in-progress: true

on:
  workflow_dispatch: {}
  # Disabled for now: a daily release is pointless while the "test" branch
  # does not change every day. Uncomment both lines to build automatically
  # every day at 00:00 UTC.
  schedule:
    - cron: '0 0 * * *'

jobs:
  build:
    name: "${{ matrix.name }} (${{ matrix.arch }})"
    runs-on: ${{ matrix.runs-on }}
    strategy:
      matrix:
        include:
          - runs-on: ubuntu-latest
            name: Build AppImage
            arch: x86_64
          # comment out these 3 lines if aarch64 is not wanted
          - runs-on: ubuntu-24.04-arm
            name: Build AppImage
            arch: aarch64

    container: ghcr.io/pkgforge-dev/archlinux:latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # The nightly always builds the "test" (beta/devel) branch.
          ref: test
      - name: Set version
        run: |
          echo "VERSION=beta-nightly" >> $GITHUB_ENV
      - name: Preparing Container
        uses: pkgforge-dev/anylinux-setup-action@0964f2258d6c93d1391359978dde081fd8b3c6af # v2
      - name: Install Dependencies
        run: /bin/sh ./appimage-build/get-dependencies.sh
      - name: Make AppImage
        run: /bin/sh ./appimage-build/make-appimage.sh
      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: AppImage-${{ matrix.arch }}
          path: dist

  release:
    needs: [build]
    permissions: write-all
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: AppImage-*
          merge-multiple: true
        continue-on-error: true
      - name: Release Nightly AppImage
        uses: pkgforge-dev/make-nightly-appimage-release@17cbe90fc0796286e424619a54a82a3a880efe4c # v1.1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
